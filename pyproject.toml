[project]
name = "duck_api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.2.2",
    "loguru>=0.7.3",
    "pandas>=2.2.3",
    "requests>=2.32.3",
    "aiohttp>=3.9.3",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.399",
    "pytest>=8.1.1",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.11.5",
    "pytest-cov>=6.1.1",
]




[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "PL", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
